[package]
name = "bevy_voxel_world"
description = "A voxel world plugin for Bevy"
version = "0.19.2"
edition = "2021"
authors = ["Joacim Magnusson <joacim@isogram.se>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/splashdust/bevy_voxel_world"
repository = "https://github.com/splashdust/bevy_voxel_world"
documentation = "https://github.com/splashdust/bevy_voxel_world"
readme = "README.md"
exclude = ["/.github/", "/assets/", "/examples/", "/website/"]
keywords = ["bevy", "gamedev", "voxelengine", "voxels"]
categories = ["game-development", "graphics"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
navigation = []
# Light from the sky and from emissive voxels, spreading through open voxels.
light_propagation = []
# Profiling spans for the crate's own work, alongside Bevy's.
trace = ["bevy/trace"]
# `trace`, sent to the Tracy profiler.
trace_tracy = ["trace", "bevy/trace_tracy"]
# `Serialize` and `Deserialize` on voxels and edit deltas, in any format.
serde = ["dep:serde"]

[[example]]
name = "fast_traversal_ray"
path = "examples/fast_traversal_ray.rs"

[[example]]
name = "bombs"
path = "examples/bombs.rs"

[[example]]
name = "noise_terrain"
path = "examples/noise_terrain.rs"

[[example]]
name = "noise_terrain_lod"
path = "examples/noise_terrain_lod.rs"

[[example]]
name = "custom_meshing"
path = "examples/custom_meshing.rs"

[[example]]
name = "marching_cubes"
path = "examples/marching_cubes.rs"

[[example]]
name = "multiple_worlds"
path = "examples/multiple_worlds.rs"

[[example]]
name = "multiple_noise_terrain"
path = "examples/multiple_noise_terrain.rs"

[[example]]
name = "multiple_cameras"
path = "examples/multiple_cameras.rs"

[[example]]
name = "navigation"
path = "examples/navigation.rs"
required-features = ["navigation"]

[[example]]
name = "light_mountain_house"
path = "examples/light_mountain_house.rs"
required-features = ["light_propagation"]

[[example]]
name = "light_flythrough"
path = "examples/light_flythrough.rs"
required-features = ["light_propagation"]

[[example]]
name = "light_tuning"
path = "examples/light_tuning/main.rs"
required-features = ["light_propagation"]
# Its tests check that the config it prints is the Rust that builds it.
test = true

# Pixel checks that need a GPU, run by hand: see the file's docs.
[[test]]
name = "light_render"
harness = false
test = false
required-features = ["light_propagation"]

[[bench]]
name = "chunk_lifecycle"
harness = false

[[bench]]
name = "light_kernels"
harness = false
required-features = ["light_propagation"]

[dependencies]
ahash = "0.8.11"
bevy = { version = "0.20", default-features = false, features = [
  "bevy_asset",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_gizmos",
  "png",
] }
block-mesh = "0.2.0"
futures-lite = "2.6.1"
hashbrown = "0.17.1"
ndshape = "0.3.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
weak-table = { version = "0.4.0", features = ["ahash"] }

# The browser needs a getrandom backend enabled for each version in use: rand
# depends on 0.4, and ahash on 0.3.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = [
  "wasm_js",
] }

[dev-dependencies]
bevy_northstar = { version = "0.8.0" }
# `bevy_feathers` draws the `light_tuning` example's settings panel.
bevy = { version = "0.20", default-features = false, features = [
  "3d",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_feathers",
  "png",
] }
bevy_panorbit_camera = { version = "0.36.0" }
libc = "0.2"
# Formats for edit deltas in tests and examples: the crate imposes none.
lz4_flex = "0.14"
noise = { version = "0.9.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
transvoxel = "2.0.0"

# Examples built for the browser render through WebGL2 into the page's canvas,
# and the `light_render` test reads its arguments from the page's address.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "web",
  "webgl2",
] }
web-sys = { version = "0.3", features = ["Location", "Window"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
codegen-units = 1
