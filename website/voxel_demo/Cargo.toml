[package]
name = "voxel_demo"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Stands alone so that its features, profile and lockfile stay out of the crate's.
[workspace]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_winit",
  "default_font",
  "png",
  "std",
  "tonemapping_luts",
  "web",
  "webgl2",
  "zstd_rust",
] }
bevy_voxel_world = { path = "../..", features = ["light_propagation"] }
noise = "0.9.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
