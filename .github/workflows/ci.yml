name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Run the library tests and doc tests for each feature set in its own job,
  # so the sets run side by side. No code depends on serde and light
  # propagation together, so serde is tested on its own; Clippy checks the
  # pair. Sub-grids and dislodged fragments are tested on their own and
  # together with light propagation. Only the examples with tests are built
  # here: Clippy checks the rest, and the benchmarks, without linking them.
  # An example can need more features than its row's library tests, so
  # example_flags gives the features its tests build with.
  test:
    name: Test Suite (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "", examples: "", example_flags: "" }
          - { name: light_propagation, flags: "--features light_propagation", examples: "--example light_tuning", example_flags: "--features light_propagation,sub_grids" }
          - { name: serde, flags: "--features serde", examples: "--example save_load --example multiplayer_loopback", example_flags: "--features serde,sub_grids" }
          - { name: sub_grids, flags: "--features sub_grids", examples: "", example_flags: "" }
          - { name: dislodged_fragments, flags: "--features dislodged_fragments", examples: "", example_flags: "" }
          - { name: light_propagation-sub_grids-dislodged_fragments, flags: "--features light_propagation,sub_grids,dislodged_fragments", examples: "", example_flags: "" }
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      # Caches the dependencies, keyed on Cargo.lock and the toolchain, so a
      # Cargo.toml edit doesn't throw the cache away.
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
          cache-on-failure: true
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Run library tests
        run: cargo test --lib ${{ matrix.features.flags }}
      # These run even when the library tests failed, so one run reports
      # every kind of test.
      - name: Run doc tests
        if: success() || failure()
        run: cargo test --doc ${{ matrix.features.flags }}
      - name: Run example tests
        if: (success() || failure()) && matrix.features.examples != ''
        run: cargo test ${{ matrix.features.example_flags }} ${{ matrix.features.examples }}

  # Run cargo clippy on every target, so the examples, benchmarks and tests
  # are checked too, with the default features, with light propagation, with
  # serde and light propagation together, and with every feature, which
  # builds every example
  clippy_check:
    name: Clippy (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "" }
          - { name: light_propagation, flags: "--features light_propagation" }
          - { name: serde-light_propagation, flags: "--features serde,light_propagation" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features.name }}
          cache-on-failure: true
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Run clippy
        run: cargo clippy --all-targets ${{ matrix.features.flags }} -- -D warnings
        env:
          RUSTFLAGS: "-C debuginfo=0"

  # Run cargo fmt --all -- --check
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
